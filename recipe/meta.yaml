{% set name = "azure-mgmt-marketplaceordering" %}
{% set version = "1.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.zip
  sha256: 68b381f52a4df4435dacad5a97e1c59ac4c981f667dcca8f9d04453417d60ad8
  
build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - wheel
    - setuptools
  run:
    - python
    - msrest >=0.5.0
    - azure-common >=1.1,<2.0
    - azure-mgmt-core >=1.2.0,<2.0.0
    # _marketplace_ordering_agreements_enums.py - line 10
    # from six import with_metaclass
    - six

test:
  imports:
    - azure
    - azure.mgmt
    - azure.mgmt.marketplaceordering

about:
  home: https://github.com/Azure/azure-sdk-for-python
  summary: Microsoft Azure Market Place Ordering Client Library for Python.
  license: MIT
  license_family: MIT
  license_file: LICENSE.txt
  description: Microsoft Azure Market Place Ordering Client Library for Python.
  dev_url: https://github.com/Azure/azure-sdk-for-python
  doc_url: https://github.com/Azure/azure-sdk-for-python


extra:
  recipe-maintainers:
    - tim-werner
